<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إشارة – مجتمع المتداولين</title>
<meta name="theme-color" content="#3358f4"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#101828;--mute:#667085;--line:#e1e6ee;--acc:#3358f4;--ai:#fff;--up:#0f9d58;--dn:#e5384d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a101c;--card:#131b2b;--ink:#e8edf7;--mute:#8a97ad;--line:#232d42;--acc:#6b8cff;--ai:#0a101c;--up:#2fd17f;--dn:#ff6478}}
:root[data-theme="dark"]{--bg:#0a101c;--card:#131b2b;--ink:#e8edf7;--mute:#8a97ad;--line:#232d42;--acc:#6b8cff;--ai:#0a101c;--up:#2fd17f;--dn:#ff6478}
*{box-sizing:border-box}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 "IBM Plex Sans Arabic",Tahoma,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.logo{font-size:28px;font-weight:600;margin:0;color:var(--acc)}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px}
.btn{background:var(--acc);color:var(--ai);border:0;border-radius:12px;padding:10px 20px;font-weight:600}
.btn.full{width:100%;padding:13px}.btn.sm{padding:4px 14px;font-size:14px;border-radius:10px}
.btn.line{background:none;color:var(--acc);border:1.5px solid var(--acc)}
.lnk{background:none;border:0;color:var(--acc);padding:8px 0;width:100%}
#app{max-width:560px;margin:0 auto;padding-bottom:88px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.pad{padding:12px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none;border:0}
.mute{color:var(--mute);font-size:13px}.err{color:var(--dn);min-height:22px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 16px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--ai);border-color:var(--acc)}
.tag{font-size:12px;padding:1px 10px;border-radius:8px;background:var(--bg);color:var(--mute)}
.side{font-weight:600;padding:2px 12px;border-radius:8px;color:#fff}.long{background:var(--up)}.short{background:var(--dn)}
.lv,.g3,.g4{display:grid;gap:8px;margin:10px 0}.lv,.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr);text-align:center}
.lv div,.g4 div{background:var(--bg);border-radius:12px;padding:8px 10px}
.lv b,.g4 b{display:block;font-size:15px}
.tp b,.up{color:var(--up)}.sl b,.dn{color:var(--dn)}
.sym{font-size:20px;font-weight:600;direction:ltr}
.acts{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:8px;margin-top:10px;flex-wrap:wrap}
.act{background:none;border:0;padding:6px 12px;border-radius:10px;color:var(--mute)}.act.on{color:var(--dn);font-weight:600}
.cm{display:grid;gap:6px;margin-top:8px}.cm div{background:var(--bg);border-radius:12px;padding:6px 12px}
.cf{display:flex;gap:8px}.cf input{margin:0}
.mk{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.mk:last-child{border:0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav button{background:none;border:0;padding:8px 0 6px;color:var(--mute);font-size:12px;display:grid;justify-items:center}
nav button i{font-style:normal;font-size:20px;line-height:1.3}nav button.on{color:var(--acc);font-weight:600}
nav .fab{background:var(--acc);color:var(--ai);width:52px;height:52px;border-radius:50%;margin:-18px auto 0;font-size:28px;line-height:1;display:grid;place-items:center;padding:0}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px}
.seg .on{background:var(--acc);color:var(--ai);border-color:var(--acc)}.seg .on.long{background:var(--up);border-color:var(--up);color:#fff}.seg .on.short{background:var(--dn);border-color:var(--dn);color:#fff}
#chat{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:8px 14px;border-radius:16px;overflow-wrap:anywhere}
.b.me{align-self:flex-start;background:var(--acc);color:var(--ai)}.b.th{align-self:flex-end;background:var(--card);border:1px solid var(--line)}
.cbar{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}.cbar input{margin:0}
input,textarea{font-size:16px}
.c-long{border-inline-start:4px solid var(--up)}.c-short{border-inline-start:4px solid var(--dn)}
.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sk{height:130px;border-radius:16px;background:linear-gradient(90deg,var(--card) 30%,var(--line) 50%,var(--card) 70%);background-size:250% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-250% 0}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:40;max-width:90%;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}
.fl-up{animation:fu 1s}.fl-dn{animation:fd 1s}@keyframes fu{from{background:rgba(15,157,88,.28)}}@keyframes fd{from{background:rgba(229,56,77,.28)}}
nav button.on::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--acc);margin-top:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="auth"><div class="box">
<h1 class="logo">إشارة</h1>
<p class="mute" style="margin:2px 0 16px">مجتمع المتداولين: صفقات الفيوتشرز والسبوت، وجورنال لكل استراتيجية.</p>
<b id="at" style="display:block;margin-bottom:10px"></b>
<input id="un" placeholder="اسم المستخدم" maxlength="20" autocomplete="username">
<input id="pw" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)">
<div class="err" id="ae"></div>
<button class="btn full" id="ab"></button>
<button class="lnk" id="as"></button>
<p class="mute" style="margin:8px 0 0">المحتوى للنقاش فقط وليس توصية مالية. <a href="/terms.html" target="_blank" style="color:var(--acc)">الشروط والخصوصية</a></p>
</div></section>

<div id="app" class="hide">
<header><div class="row"><h1 class="logo">إشارة</h1><span class="mute" id="tt"></span></div><button class="av" id="me" aria-label="حسابي"></button></header>
<div id="v-home" class="pad"></div><div id="v-mk" class="pad hide"></div><div id="v-jr" class="pad hide"></div><div id="v-msg" class="pad hide"></div>
<nav><div>
<button data-t="home"><i>⌂</i>الرئيسية</button><button data-t="mk"><i>◔</i>الأسواق</button>
<button class="fab" id="fab" aria-label="نشر">+</button>
<button data-t="jr"><i>▤</i>الجورنال</button><button data-t="msg"><i>✉</i>الرسائل</button>
</div></nav>
</div>

<div id="toast" role="status"></div>
<div id="chat" class="hide">
<header><div class="row"><button class="act" id="bk">→ رجوع</button><b id="cn"></b></div></header>
<div id="msgs"></div>
<div class="cbar"><input id="ci" placeholder="اكتب رسالة" autocomplete="off"><button class="btn" id="cs">إرسال</button></div>
</div>

<script>
const $=i=>document.getElementById(i),C=["#3358f4","#e5384d","#0f9d58","#d98a1c","#8a5cd6","#0b8fb0"];
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const col=n=>C[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%6];
function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function inp(ph,c,t){const i=h("input",c);i.placeholder=ph;if(t)i.inputMode=t;return i}
const av=(n,s)=>{const a=h("div","av",n[0]);a.style.background=col(n);if(s)a.style.cssText+=`;width:${s}px;height:${s}px`;return a};
const f=n=>Number(n).toLocaleString("en-US",{maximumFractionDigits:6});
const sg=n=>(n>0?"+":"")+f(n);
const ago=t=>{const d=Math.max(0,Math.round((Date.now()/1000-t)/60));return d<1?"الآن":d<60?`قبل ${d} د`:d<1440?`قبل ${Math.round(d/60)} س`:`قبل ${Math.round(d/1440)} يوم`};
let T=ls("tk"),ME=ls("un"),tab="home",flt="all",dk=ls("dk"),cur=null,poll=null;const O=new Set(),R={};

const NOSRV="الخادم غير متصل. شغّل server.py ثم افتح الصفحة من http://localhost:5000 (وليس بفتح الملف مباشرة).";
async function api(p,o={}){
 const r=await fetch("/api/"+p,{method:o.m||(o.b?"POST":"GET"),headers:{"Content-Type":"application/json",...(T?{Authorization:"Bearer "+T}:{})},body:o.b?JSON.stringify(o.b):undefined}).catch(()=>{throw new Error(NOSRV)});
 const d=await r.json().catch(()=>({}));
 if(r.status===401&&T&&p!=="login"&&p!=="register"){out()}
 if(!r.ok)throw new Error(d.error||NOSRV);return d}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
const out=()=>{ls("tk",null);ls("un",null);location.reload()};
function theme(){const r=document.documentElement;dk?r.setAttribute("data-theme",dk==="1"?"dark":"light"):r.removeAttribute("data-theme")}

/* الدخول والتسجيل */
let mode=ls("seen")?"login":"register";
function drawAuth(){const r=mode==="register";$("at").textContent=r?"إنشاء حساب جديد":"تسجيل الدخول";$("ab").textContent=r?"إنشاء الحساب":"دخول";$("as").textContent=r?"لديك حساب؟ سجّل الدخول":"مستخدم جديد؟ أنشئ حساباً";$("pw").autocomplete=r?"new-password":"current-password"}
$("as").onclick=()=>{mode=mode==="register"?"login":"register";$("ae").textContent="";drawAuth()};
async function submitAuth(){$("ae").textContent="";try{const d=await api(mode,{b:{username:$("un").value.trim(),password:$("pw").value}});T=d.token;ME=d.username;ls("tk",T);ls("un",ME);ls("seen","1");start()}catch(e){$("ae").textContent=e.message}}
$("ab").onclick=submitAuth;$("pw").onkeydown=e=>{if(e.key==="Enter")submitAuth()};
function start(){$("auth").classList.add("hide");$("app").classList.remove("hide");theme();const m=$("me");m.textContent=ME[0];m.style.background=col(ME);go("home")}
drawAuth();theme();
if(T)api("me").then(d=>{ME=d.username;start()}).catch(()=>{});

/* التنقل */
const TT={home:"الرئيسية",mk:"الأسواق",jr:"الجورنال",msg:"الرسائل"};
function go(t){tab=t;$("tt").textContent=TT[t];["home","mk","jr","msg"].forEach(k=>$("v-"+k).classList.toggle("hide",k!==t));
 document.querySelectorAll("nav [data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t));R[t]()}
document.querySelectorAll("nav [data-t]").forEach(b=>b.onclick=()=>go(b.dataset.t));

/* عناصر مساعدة */
function seg(o,cb){const w=h("div","seg");let v=o[0][0];
 o.forEach(([k,l,c])=>{const b=h("button",k===v?"on "+(c||""):"",l);b.onclick=()=>{v=k;[...w.children].forEach((x,i)=>x.className=o[i][0]===k?"on "+(o[i][2]||""):"");cb&&cb(k)};w.append(b)});w.get=()=>v;return w}
function sheet(title,bd){const ov=h("div","ov"),s=h("div","sheet"),hd=h("div","row sp"),x=h("button","act","إغلاق");
 hd.style.marginBottom="10px";hd.append(h("b",null,title),x);s.append(hd,bd);ov.append(s);
 const close=()=>ov.remove();x.onclick=close;ov.onclick=e=>{if(e.target===ov)close()};document.body.append(ov);return close}

/* الرئيسية */
function card(p){const c=h("article","card"+(p.kind==="trade"?" c-"+p.side:"")),hd=h("div","row sp"),l=h("div","row"),w=h("div"),r=h("div","row");
 w.append(h("b",null,p.u),h("div","mute",ago(p.ts)));l.append(av(p.u),w);
 if(p.kind==="trade")r.append(h("span","tag",p.mk==="futures"?"فيوتشرز":"سبوت"),h("span","side "+p.side,p.side==="long"?"شراء":"بيع"));
 if(p.u!==ME&&!p.fl){const b=h("button","btn line sm","متابعة");b.onclick=async()=>{await api("follow/"+encodeURIComponent(p.u),{b:{}});R.home()};r.append(b)}
 hd.append(l,r);c.append(hd);
 if(p.kind==="trade"){const rr=Math.abs(p.tp-p.en)/Math.abs(p.en-p.sl),s=h("div","row sp");s.style.marginTop="8px";
  s.append(h("span","sym",p.sym),h("span","tag num","R:R 1:"+rr.toFixed(2)));
  const lv=h("div","lv");[["","الدخول",p.en],["sl","وقف الخسارة",p.sl],["tp","الهدف",p.tp]].forEach(([k,n,x])=>{const d=h("div",k);d.append(h("span","mute",n),h("b","num",f(x)));lv.append(d)});c.append(s,lv)}
 if(p.text){const t=h("p",null,p.text);t.style.cssText="margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere";c.append(t)}
 const a=h("div","acts"),lk=h("button","act"+(p.ld?" on":""),(p.ld?"♥ ":"♡ ")+p.lk);
 lk.onclick=async()=>{await api(`posts/${p.id}/like`,{b:{}});R.home()};
 const cb=h("button","act","💬 "+p.cc);cb.onclick=()=>{O.has(p.id)?O.delete(p.id):O.add(p.id);R.home()};a.append(lk,cb);
 if(p.kind==="trade"){const j=h("button","act","▤ للجورنال");j.onclick=()=>jform({sym:p.sym,side:p.side,en:p.en,sl:p.sl});a.append(j)}
 if(p.u===ME){const x=h("button","act","حذف");x.onclick=async()=>{if(confirm("حذف منشورك؟")){try{await api("posts/"+p.id,{m:"DELETE"});toast("تم الحذف");R.home()}catch(e){toast(e.message)}}};a.append(x)}
 if(p.u!==ME){const rp=h("button","act","⚑ إبلاغ");rp.onclick=async()=>{if(confirm("الإبلاغ عن هذا المنشور؟")){try{await api(`posts/${p.id}/report`,{b:{}});toast("وصلنا بلاغك، شكراً");R.home()}catch(e){toast(e.message)}}};a.append(rp)}
 c.append(a);
 if(O.has(p.id)){const bx=h("div","cm");c.append(bx);
  api(`posts/${p.id}/comments`).then(L=>{L.forEach(x=>{const d=h("div");d.append(h("b",null,x.u+": "),document.createTextNode(x.text));bx.append(d)});
   const fm=h("div","cf"),i=inp("اكتب تعليقاً"),s=h("button","btn sm","إرسال");
   const go=async()=>{const t=i.value.trim();if(!t)return;await api(`posts/${p.id}/comments`,{b:{text:t}});R.home()};s.onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()};fm.append(i,s);bx.append(fm)}).catch(()=>{})}
 return c}
R.home=async()=>{const v=$("v-home");v.replaceChildren();
 const ch=h("div","chips");[["all","الكل"],["trade","الصفقات"],["free","المنشورات"],["fol","من أتابعهم"]].forEach(([k,l])=>{const b=h("button","chip"+(flt===k?" on":""),l);b.onclick=()=>{flt=k;R.home()};ch.append(b)});v.append(ch);
 const sk=[h("div","sk"),h("div","sk")];v.append(...sk);let L;try{L=await api("posts?kind="+flt)}catch(e){sk.forEach(x=>x.remove());v.append(h("div","card err",e.message));return}sk.forEach(x=>x.remove());
 if(!L.length)v.append(h("div","card mute","لا توجد منشورات بعد. اضغط + وكن أول من ينشر."));
 L.forEach(p=>v.append(card(p)))};

/* نشر */
$("fab").onclick=()=>{const b=h("div");let tf;
 const kind=seg([["trade","صفقة"],["free","منشور حر"]],k=>tf.classList.toggle("hide",k!=="trade"));
 const mk=seg([["futures","فيوتشرز"],["spot","سبوت"]]),sd=seg([["long","شراء Long","long"],["short","بيع Short"]],k=>{[...sd.children][1].classList.toggle("short",k==="short")});
 const sy=inp("الرمز مثل BTCUSDT","num"),en=inp("الدخول","num","decimal"),sl=inp("وقف الخسارة","num","decimal"),tp=inp("الهدف","num","decimal"),g3=h("div","g3");
 sy.autocapitalize="characters";g3.append(en,sl,tp);
 const pv=h("div","mute num"),upd=()=>{const a=+en.value,b=+sl.value,c=+tp.value;pv.textContent=a&&b&&c&&a!==b?"R:R 1:"+(Math.abs(c-a)/Math.abs(a-b)).toFixed(2):""};[en,sl,tp].forEach(i=>i.oninput=upd);
 tf=h("div");tf.append(mk,sd,sy,g3,pv);
 const tx=h("textarea");tx.rows=3;tx.maxLength=500;tx.placeholder="اكتب ما تريد… تحليلك أو سبب الصفقة أو أي موضوع";
 const er=h("div","err"),pb=h("button","btn full","نشر");
 pb.onclick=async()=>{er.textContent="";try{await api("posts",{b:{kind:kind.get(),text:tx.value,mk:mk.get(),side:sd.get(),sym:sy.value,en:en.value,sl:sl.value,tp:tp.value}});close();flt="all";go("home");toast("تم النشر ✓")}catch(e){er.textContent=e.message}};
 b.append(kind,tf,tx,er,pb);const close=sheet("منشور جديد",b)};

/* الجورنال */
function jform(pre){const b=h("div"),st=inp("الاستراتيجية (مثل: كسر الدعم، سكالبينج)"),dl=h("datalist");dl.id="dl";(window.STR||[]).forEach(s=>{const o=h("option");o.value=s;dl.append(o)});st.setAttribute("list","dl");
 const sd=seg([["long","شراء Long","long"],["short","بيع Short"]],k=>{[...sd.children][1].classList.toggle("short",k==="short")});
 if(pre.side==="short")[...sd.children][1].click();
 const sy=inp("الرمز","num");sy.value=pre.sym||"";sy.autocapitalize="characters";
 const en=inp("الدخول","num","decimal"),sl=inp("وقف الخسارة","num","decimal"),ex=inp("سعر الخروج","num","decimal"),qt=inp("الكمية","num","decimal"),fe=inp("الرسوم (اختياري)","num","decimal"),nt=inp("ملاحظة (اختياري)");
 en.value=pre.en||"";sl.value=pre.sl||"";
 const g3=h("div","g3");g3.append(en,sl,ex);const g2=h("div","g3");g2.style.gridTemplateColumns="1fr 1fr";g2.append(qt,fe);
 const er=h("div","err"),pb=h("button","btn full","حفظ في الجورنال");
 pb.onclick=async()=>{er.textContent="";try{await api("journal",{b:{strategy:st.value,sym:sy.value,side:sd.get(),en:en.value,sl:sl.value,ex:ex.value,qty:qt.value,fee:fe.value,note:nt.value}});close();go("jr");toast("حُفظت في الجورنال ✓")}catch(e){er.textContent=e.message}};

function spark(a){const W=300,H=70,mn=Math.min(0,...a),mx=Math.max(0,...a),r=(mx-mn)||1,N="http://www.w3.org/2000/svg",y=v=>H-(v-mn)/r*(H-8)-4;
 const s=document.createElementNS(N,"svg"),l=document.createElementNS(N,"line"),p=document.createElementNS(N,"polyline");
 s.setAttribute("viewBox",`0 0 ${W} ${H}`);s.style.cssText="width:100%;height:80px;direction:ltr";
 [["x1",0],["x2",W],["y1",y(0)],["y2",y(0)],["stroke","var(--line)"]].forEach(([k,v])=>l.setAttribute(k,v));
 [["points",a.map((v,i)=>(i/(a.length-1)*W)+","+y(v)).join(" ")],["fill","none"],["stroke",a[a.length-1]>=0?"var(--up)":"var(--dn)"],["stroke-width",2.5],["stroke-linejoin","round"]].forEach(([k,v])=>p.setAttribute(k,v));
 s.append(l,p);return s}

  const s=h("div","row sp");s.style.marginTop="6px";s.append(h("b","num "+(x.pnl>=0?"up":"dn"),sg(x.pnl)),h("span","mute num","R "+sg(x.r)),h("span","mute",ago(x.ts)));c.append(r,s);
